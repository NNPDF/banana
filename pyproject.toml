[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "banana-hep"
version = "0.0.0"
description = "Benchmark QCD physics"
readme = "README.md"
authors = ["banana team"]
repository = "https://github.com/N3PDF/banana"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
include = ["src/banana/data/theory_template.yaml"]
packages = [{ include = "banana", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
ipython = "^8.1.0"
SQLAlchemy = "^1.4.29"
numpy = ">=1.26"
pandas = "^2.1.4"
matplotlib = "^3.5.1"
rich = "^12.4.4"
PyYAML = "^6.0"
click = "^8.0.3"
pendulum = "^3.0.0"
appdirs = "^1.4.4"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^7.0.0"
sphinx-rtd-theme = "^1.0.0"
sphinxcontrib-bibtex = "^2.4.1"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=9.0.3,<10.0"
pytest-cov = "4.0.0"
pyfakefs = "^5.2.3"
scipy = "^1.11.1"

[tool.poetry.group.dev.dependencies]
pdbpp = "^0.11.6"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"
dirty = true

[tool.poetry-dynamic-versioning.substitution]
files = ["src/banana/__init__.py"]

[tool.poe.tasks]
coverage = "$BROWSER htmlcov/index.html"
test = "pytest tests"
test-cov = ["test", "coverage"]
docs = { "shell" = "cd docs; make html" }
docs-view = { "shell" = "cd docs; make view" }
docs-server = { "shell" = "cd docs; make server" }
docs-clean = { "shell" = "cd docs; make clean" }
docs-cleanall = { "shell" = "cd docs; make cleanall" }

[tool.pytest.ini_options]
addopts = [
  '--cov=banana',
  '--cov-report=html',
  '--cov-report=xml',
  '--strict-markers',
]
